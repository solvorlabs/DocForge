[package]
name = "docforge"
version = "1.0.0"
edition = "2021"
description = "Generate prompt-ready context files for any library — pinned to your exact version"
license = "MIT"

[[bin]]
name = "dcf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
indicatif = "0.17"
rustyline = "14"
anyhow = "1"
dirs = "5"
toml = "0.8"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
